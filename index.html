<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Apple Music Clone</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <!-- Navbar estilo Apple Music -->
    <nav class="navbar">
      <h1>Biblioteca</h1>
      <input type="text" id="search" placeholder="Pesquisar músicas..." />
    </nav>

    <!-- Área de exibição dos álbuns -->
    <div id="music-list" class="grid"></div>

    <!-- Player fixo -->
    <div id="player">
      <img id="album-cover" src="" alt="Capa" />
      <div>
        <h3 id="song-title">Nome da música</h3>
        <p id="artist-name">Artista</p>
      </div>
      <audio id="audio" controls></audio>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
